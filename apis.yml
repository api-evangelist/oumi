name: Oumi
description: >-
  Oumi (Open Universal Machine Intelligence) is an open-source, Apache-2.0 platform for
  ML engineers and researchers to train, fine-tune, evaluate, and deploy foundation
  models (LLMs and VLMs) through a single unified interface. It ships as a Python
  library and a first-party command-line tool (train, evaluate, infer, launch, deploy,
  analyze, synth, tune) covering the full model development lifecycle — data synthesis,
  supervised fine-tuning, DPO/preference learning, evaluation judges, quantization,
  hyperparameter tuning, and inference across local, cloud, and HPC targets. A hosted
  managed platform (platform.oumi.ai) adds a Free/Pro/Enterprise product layer, and an
  oumi-mcp Model Context Protocol server exposes Oumi to MCP-capable assistants such as
  Claude and Cursor. Backed by Obvious Ventures.
